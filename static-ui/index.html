<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ActivityPub</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css"
    />
    <meta name="color-scheme" content="dark light" />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"
    ></script>
    <script
      nomodule=""
      src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"
    ></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@pod-os/elements/dist/elements/elements.esm.js"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/@pod-os/elements/dist/elements/elements.css"
      rel="stylesheet"
    />
    <script src="/components/ImportHtml.js" defer></script>
  </head>
  <body>
    <pos-app restore-previous-session>
      <pos-router mode="pod">
        <pos-resource uri="{{BASE_URL}}/">
          <ion-content class="ion-padding">
            <h1>ActivityPub</h1>
            <p>
              This server hosts ActivityPub actor(s) backed by a Solid pod.
              Follow any handle from your fediverse account.
            </p>
            <ul id="actors">
              <!-- one <li> per actor, emitted by scripts/generate-identity.ts -->
            </ul>
            <p>
              <small
                >For machine-readable actor documents, request
                <code>Accept: application/activity+json</code>.</small
              >
            </p>
            <pos-login>
              <p slot="default">
                Sign in with your WebID to list the actors you control.
              </p>
              <div slot="if-logged-in">
                <import-html src="/templates/actor-controls.html"></import-html>
              </div>
            </pos-login>
          </ion-content>
        </pos-resource>
      </pos-router>
    </pos-app>
    <script type="module" src="/components/webid-resource.js"></script>
    <script type="module" src="/templates/update-location.js"></script>
  </body>
</html>
